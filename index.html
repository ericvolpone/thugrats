<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#120d14" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Thugrats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- home screen -->
    <div id="home" class="hidden"></div>

    <!-- in-run -->
    <div id="hud" class="hidden">
      <div id="xpbar"><i></i><span></span></div>
      <div class="hud-top">
        <div class="hud-left">
          <div id="hpbar"><i></i><b></b><span></span></div>
          <div class="hud-chips">
            <div class="chip" id="hud-gold">💰 0</div>
            <div class="chip" id="hud-kills">💀 0</div>
            <div class="chip hidden" id="hud-contracts" title="Completed contracts: trade them at the Black Market">📜 0</div>
          </div>
          <div id="titan-list"></div>
        </div>
        <div class="hud-center">
          <div id="hud-time">0:00</div>
          <div id="boss-bars"></div>
        </div>
        <div class="hud-right">
          <canvas id="minimap" width="300" height="300"></canvas>
          <button id="pause-btn" aria-label="Pause">❚❚</button>
        </div>
      </div>
      <div class="hud-bottom">
        <div id="ability-bar"></div>
        <div id="item-bar"></div>
      </div>
      <div id="dmeter">
        <div class="dm-head"><b>DAMAGE</b><span id="dm-total">0 DPS</span><button id="dm-reset" title="Reset the meter">↺ Reset</button></div>
        <div id="dm-rows"></div>
        <div class="dm-foot">bar: total since reset · right: DPS (last 30s)</div>
      </div>
      <div id="banner"><h1></h1><p></p></div>
      <div id="toasts"></div>
      <div id="hurt"></div>
    </div>
    <div id="dmg-layer"></div>
    <div id="touch-zone" class="hidden"></div>
    <div id="stick"><div class="knob"></div></div>
    <button id="jump-btn" class="hidden" aria-label="Jump">JUMP</button>

    <div id="choice" class="hidden overlay">
      <div class="panel wide">
        <p id="choice-reason"></p>
        <h2 id="choice-title">Pick one</h2>
        <div id="choice-cards"></div>
        <div class="row">
          <button id="choice-reroll" class="btn ghost">🎲 Reroll</button>
          <button id="choice-banish" class="btn ghost">🚫 Banish</button>
          <button id="choice-skip" class="btn ghost">Skip</button>
        </div>
        <p id="choice-banish-note" class="banish-note"></p>
        <div class="pad-hint">Ⓐ pick · Ⓧ reroll · Ⓨ banish · D-pad / stick to move</div>
      </div>
    </div>

    <div id="pause" class="hidden overlay">
      <div class="panel wide">
        <h2>Paused</h2>
        <div id="pause-build"></div>
        <p class="note" style="text-align:center">Move: WASD / left stick / drag left side · Turn camera: Q E / right stick / drag · Jump: Space / Ⓐ / JUMP button</p>
        <div class="row">
          <button class="btn" data-act="resume">Resume</button>
          <button class="btn ghost" data-act="quit">Abandon Run</button>
        </div>
      </div>
    </div>

    <div id="end" class="hidden overlay">
      <div class="panel wide" id="end-panel"></div>
    </div>

    <div id="fade"></div>
    <div id="loading">Loading Thugrats…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
